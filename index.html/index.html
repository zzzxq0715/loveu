<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你喜不喜欢我呀</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            background-color:#b8e8f8; /*天蓝色背景*/
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
      .page{
  display: none;
  position:relative; /*震动必需*/
  width: 340px;
  padding:30px;
  background:#fff;
  border-radius:20px;
  text-align:center;
}
.page.active{
  display:block;
}
.avatar-circle{
  width:140px;
  height:140px;
  margin:0 auto 20px;
}
.avatar-circle img{
  width:100%;
  border-radius:50%;
  object-fit:cover;
}
.title{
  font-size:22px;
  margin-bottom:10px;
}
.tip{
  font-size:15px;
  color:#666;
  margin-bottom:26px;
}
.btn-group{
  display:flex;
  gap:20px;
  justify-content:center;
}
button{
  padding:10px 22px;
  border:none;
  border-radius:999px;
  background:#87CEEB; /*天蓝色按钮*/
  color:#fff;
  font-size:17px;
  cursor:pointer;
}
/*震动动画*/
@keyframes shake{
  0% {transform: translateX(0)}
  20% {transform: translateX(-6px)}
  40% {transform: translateX(6px)}
  60% {transform: translateX(-4px)}
  80% {transform: translateX(4px)}
  100% {transform: translateX(0)}
}
.shake{
  animation: shake 0.3s ease-in-out;
}
.video-box{
  width:340px;
}
video{
  width:100%;
  border-radius:16px;
}
</style>
</head>
<body>
<!--第一页 表白卡片-->
<div class="page active" id="page1">
  <div class="avatar-circle">
    <img id="avatarImg" src="normal.png" alt="小人">
  </div>
  <div class="title">你喜不喜欢我呀?</div>
  <div class="tip">四川人，给我好好回答</div>
  <div class="btn-group">
    <button id="yesBtn">当然啦 💙</button>
    <button id="noBtn">不喜欢 😔</button>
  </div>
</div>

<!--第二页 视频页面-->
<div class="page" id="page2">
  <div class="video-box">
    <video id="myVideo" controls>
      <source src="video.mp4" type="video/mp4">
      浏览器不支持视频，请把video.mp4放到同一文件夹
    </video>
  </div>
</div>

<script>
const avatarImg = document.getElementById('avatarImg');
const page1 = document.getElementById('page1');
const page2 = document.getElementById('page2');
const myVideo = document.getElementById('myVideo');

// 不喜欢 → 切换生气图片 + 页面震动
document.getElementById('noBtn').onclick = function(){
  avatarImg.src = "angry.png";
  page1.classList.add('shake');
  setTimeout(()=>{
    page1.classList.remove('shake');
  },300)
}

// 好的 → 切换开心图片，延时跳转视频页
document.getElementById('yesBtn').onclick = function(){
  avatarImg.src = "happy.png";
  setTimeout(()=>{
    page1.classList.remove("active");
    page2.classList.add("active");
    myVideo.play();
  },600)
}
</script>
</body>
</html>
